server:
  port: 8082
spring:
  application:
    name: geekwaves-server
  task:
    scheduling:
      pool:
        size: 4   # 默认单线程会被监控采样(OSHI 进程枚举偶发数百 ms)阻塞抓取调度
  datasource:
    url: jdbc:h2:file:./data/geekwaves;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    locations: classpath:db/migration/h2
itsuka:
  web:
    logging:
      enabled: true
geekwaves:
  storage:
    cache: local
  crypto:
    key: ${GEEKWAVES_CRYPTO_KEY:FEpOAg+GzZ960zvkY48R8l6HUCn/+VaWSPxfXFkYDL4=}
  monitor:
    enabled: true
logging:
  level:
    com.geekwaves: debug
