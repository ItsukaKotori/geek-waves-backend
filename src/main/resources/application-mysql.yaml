# 外嵌 MySQL:仅当 --spring.profiles.active=mysql 时生效(默认 H2 配置不受影响)
# 注意:默认构建未引入 mysql-connector-j 依赖,外嵌需自行添加该驱动。
spring:
  datasource:
    url: 'jdbc:mysql://localhost:3306/geekwaves?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true'
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  flyway:
    locations: classpath:db/migration/mysql
